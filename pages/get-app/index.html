<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get the Sploot App</title>
    <meta name="description" content="Download the Sploot app on iOS or Android.">
    <!-- Robots: don't index this redirect page -->
    <meta name="robots" content="noindex">

    <!--
        Smart redirect:
        - iPhone / iPad / iPod  → App Store
        - Android               → Google Play
        - Desktop / anything else → fall through to the page below (shows both store badges)

        Run the script BEFORE the body paints so iOS/Android never sees the fallback UI.
        TODO: replace the two URLs below with the real App Store and Play Store links once published.
    -->
    <script>
        (function () {
            var APP_STORE_URL = 'https://apps.apple.com/us/app/sploot-vets/id6451157992';
            var PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.splootvets.mobile&hl=en_US';

            var ua = navigator.userAgent || navigator.vendor || window.opera || '';

            // iOS detection (covers iPhone, iPad, iPod, plus iPadOS reporting as Mac with touch)
            var isIOS = /iPad|iPhone|iPod/.test(ua) ||
                        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

            // Android detection (anything Android; explicitly avoid "Android" string in non-Android crawlers)
            var isAndroid = /android/i.test(ua) && !/windows phone/i.test(ua);

            if (isIOS) {
                window.location.replace(APP_STORE_URL);
            } else if (isAndroid) {
                window.location.replace(PLAY_STORE_URL);
            }
            // else: do nothing — let the desktop fallback render
        })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'New Spirit';
            src: url('/Fonts/NewSpiritTRIAL-Medium%20copy.otf') format('opentype');
            font-weight: 500; font-style: normal;
        }
        body { font-family: 'Outfit', system-ui, sans-serif; background: #F2EAE4; color: #1B4B4B; }
        .font-heading { font-family: 'New Spirit', Georgia, serif; font-weight: 500; }
        .store-badge {
            display: inline-flex; align-items: center; gap: 10px;
            background: #1B4B4B; color: #fff;
            padding: 13px 20px; border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .store-badge:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -10px rgba(27,75,75,0.35); }
        .store-badge svg { width: 26px; height: 26px; flex-shrink: 0; }
        .store-badge .label-small { font-size: 10px; line-height: 1.1; opacity: 0.75; letter-spacing: 0.04em; text-transform: uppercase; }
        .store-badge .label-large { font-family: 'New Spirit', Georgia, serif; font-weight: 500; font-size: 18px; line-height: 1.1; margin-top: 2px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
    <main class="max-w-md text-center">
        <img src="/photos/logo.avif" alt="Sploot" class="h-10 w-auto mx-auto mb-8">

        <!-- Loading state — shown briefly while JS decides -->
        <div id="loading" class="mb-6">
            <p class="font-heading text-3xl md:text-4xl mb-3">Opening the app store…</p>
            <p class="text-sm text-sploot-teal/65" style="color: rgba(27,75,75,0.65);">If nothing happens in a few seconds, pick your store below.</p>
        </div>

        <!-- Desktop / fallback UI -->
        <div class="flex flex-wrap items-center justify-center gap-3">
            <a href="https://apps.apple.com/us/app/sploot-vets/id6451157992" class="store-badge">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.54c-.02-2.4 1.96-3.56 2.05-3.61-1.12-1.63-2.85-1.85-3.47-1.88-1.47-.15-2.88.87-3.63.87-.76 0-1.91-.85-3.14-.83-1.61.03-3.1.94-3.93 2.38-1.68 2.92-.43 7.22 1.2 9.58.81 1.15 1.77 2.45 3.02 2.4 1.22-.05 1.68-.78 3.16-.78s1.89.78 3.16.75c1.31-.02 2.13-1.16 2.93-2.32.92-1.33 1.3-2.63 1.32-2.7-.03-.01-2.54-.97-2.57-3.86zm-2.49-7.07c.67-.81 1.13-1.94 1-3.07-.97.04-2.14.65-2.83 1.46-.62.72-1.17 1.87-1.02 2.98 1.08.08 2.19-.55 2.85-1.37z"/></svg>
                <div class="flex flex-col items-start leading-none">
                    <span class="label-small">Download on the</span>
                    <span class="label-large">App Store</span>
                </div>
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.splootvets.mobile&hl=en_US" class="store-badge">
                <svg viewBox="0 0 24 24">
                    <path fill="#34A853" d="M3.6 20.5c.2.1.4.1.6.1.3 0 .6-.1.8-.3l9.7-5.6-2.6-2.6-8.5 8.4z"/>
                    <path fill="#FBBC04" d="M17.6 11.5l-2.9-1.7-3.1 3 3.1 3 2.9-1.7c.9-.5 1.4-1.2 1.4-2 0-.7-.5-1.4-1.4-2.6z"/>
                    <path fill="#4285F4" d="M3.5 3.5c-.1.2-.1.4-.1.7v15.6c0 .3 0 .5.1.7l8.8-8.5-8.8-8.5z"/>
                    <path fill="#EA4335" d="M14.7 9.8L4.9 4.2c-.2-.1-.5-.2-.7-.2-.2 0-.4 0-.6.1l8.5 8.4 2.6-2.7z"/>
                </svg>
                <div class="flex flex-col items-start leading-none">
                    <span class="label-small">Get it on</span>
                    <span class="label-large">Google Play</span>
                </div>
            </a>
        </div>

        <p class="text-xs mt-10" style="color: rgba(27,75,75,0.5);">
            <a href="/" style="color: inherit; text-decoration: underline;">Back to splootvets.com</a>
        </p>
    </main>
</body>
</html>
